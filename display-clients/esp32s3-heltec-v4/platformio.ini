; =============================================================================
; DEFLOCK ESP32 + OLED Standalone Scanner v3.0
; =============================================================================
; STANDALONE surveillance detector with built-in WiFi + BLE scanning!
; No external detector required - this device scans AND displays.
;
; Detection Methods:
;   - WiFi Promiscuous Mode: Probe requests & beacons (SSID + MAC matching)
;   - BLE Active Scan: Device names, MAC prefixes, Raven service UUIDs
;
; Supported boards:
;   heltec-esp32s3-v4  - Heltec WiFi LoRa 32 V3/V4 (ESP32-S3 + built-in OLED)
;   heltec-esp32s3-alt - Alternative pin config for some V3 variants
;   heltec-esp32-v2    - Heltec WiFi LoRa 32 V2 (ESP32 + built-in OLED)
;
; Flash: pio run -e heltec-esp32s3-v4 -t upload
; Monitor: pio device monitor -b 115200
; =============================================================================

[platformio]
default_envs = heltec-esp32s3-v4

[common]
framework = arduino
monitor_speed = 115200
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    bblanchon/ArduinoJson@^6.21.0
    h2zero/NimBLE-Arduino@^1.4.1

; =============================================================================
; Heltec WiFi LoRa 32 V3/V4 (ESP32-S3 with built-in OLED)
; =============================================================================
[env:heltec-esp32s3-v4]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    bblanchon/ArduinoJson@^6.21.0
    h2zero/NimBLE-Arduino@^1.4.1

build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Heltec V3 official OLED pins
    -DOLED_SDA=17
    -DOLED_SCL=18
    -DOLED_RST=21
    -DSCREEN_WIDTH=128
    -DSCREEN_HEIGHT=64
    ; Vext power control - LOW to enable
    -DVEXT_PIN=36
    -DHELTEC_BOARD=1
    -DLED_BUILTIN_PIN=35
    ; NimBLE config for better scanning
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=1

; =============================================================================
; Heltec V3 Alternative Pinout (if display doesn't work)
; =============================================================================
[env:heltec-esp32s3-alt]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    bblanchon/ArduinoJson@^6.21.0
    h2zero/NimBLE-Arduino@^1.4.1

build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Alternative pins (some V3 variants)
    -DOLED_SDA=41
    -DOLED_SCL=42
    -DOLED_RST=21
    -DSCREEN_WIDTH=128
    -DSCREEN_HEIGHT=64
    -DVEXT_PIN=36
    -DHELTEC_BOARD=1
    -DLED_BUILTIN_PIN=35
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=1

; =============================================================================
; Heltec WiFi LoRa 32 V2 (ESP32 with built-in OLED)
; =============================================================================
[env:heltec-esp32-v2]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200

lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    bblanchon/ArduinoJson@^6.21.0
    h2zero/NimBLE-Arduino@^1.4.1

build_flags = 
    ; Heltec V2 OLED pins (I2C)
    -DOLED_SDA=4
    -DLED_BUILTIN_PIN=25
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=1
    -DOLED_SCL=15
    -DOLED_RST=16
    -DSCREEN_WIDTH=128
    -DSCREEN_HEIGHT=64
    -DVEXT_PIN=21
    -DHELTEC_BOARD=1
