; =============================================================================
; DEFLOCK ESP32 + TFT Display Client
; =============================================================================
; Select your board and display combination below
; Build with: pio run -e <environment> -t upload
;
; Supported configurations:
;   esp32-st7789      - ESP32 DevKit + ST7789 240x240 (most common)
;   esp32-ili9341     - ESP32 DevKit + ILI9341 320x240
;   esp32-gc9a01      - ESP32 DevKit + GC9A01 240x240 round display
;   esp32-st7735      - ESP32 DevKit + ST7735 128x160 mini
;   xiao-esp32s3-tft  - Seeed Xiao ESP32-S3 with external TFT (Expansion Board)
;   lilygo-tdisplay   - LILYGO T-Display ESP32 (built-in ST7789)
; =============================================================================

[platformio]
default_envs = esp32-st7789

; -----------------------------------------------------------------------------
; Common settings for all environments
; -----------------------------------------------------------------------------
[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = 
    bodmer/TFT_eSPI@^2.5.0
    bblanchon/ArduinoJson@^6.21.0

; Serial connection to Flock detector
; Connect: Detector USB-C -> USB-Serial adapter -> ESP32 RX pin
; Default pins: RX=GPIO16, TX=GPIO17

; =============================================================================
; ESP32 DevKit + ST7789 240x240 (Most Common Mini Displays)
; =============================================================================
[env:esp32-st7789]
extends = common
board = esp32dev
build_flags = 
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DTFT_BL=4
    -DSPI_FREQUENCY=40000000
    -DDETECTOR_RX_PIN=27
    -DDETECTOR_TX_PIN=26

; =============================================================================
; ESP32 DevKit + ILI9341 320x240 (TFT Shields)
; =============================================================================
[env:esp32-ili9341]
extends = common
board = esp32dev
build_flags = 
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DTFT_BL=4
    -DSPI_FREQUENCY=40000000
    -DDETECTOR_RX_PIN=27
    -DDETECTOR_TX_PIN=26

; =============================================================================
; ESP32 DevKit + GC9A01 240x240 Round Display
; =============================================================================
[env:esp32-gc9a01]
extends = common
board = esp32dev
build_flags = 
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DTFT_BL=4
    -DSPI_FREQUENCY=40000000
    -DROUND_DISPLAY=1
    -DDETECTOR_RX_PIN=27
    -DDETECTOR_TX_PIN=26

; =============================================================================
; ESP32 DevKit + ST7735 128x160 Mini Display
; =============================================================================
[env:esp32-st7735]
extends = common
board = esp32dev
build_flags = 
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DST7735_GREENTAB=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DTFT_BL=4
    -DSPI_FREQUENCY=27000000
    -DSMALL_DISPLAY=1
    -DDETECTOR_RX_PIN=27
    -DDETECTOR_TX_PIN=26

; =============================================================================
; Seeed Xiao ESP32-S3 + External TFT (Use with Expansion Board)
; =============================================================================
[env:xiao-esp32s3-tft]
extends = common
board = seeed_xiao_esp32s3
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.flash_size = 8MB
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=9
    -DTFT_SCLK=7
    -DTFT_CS=3
    -DTFT_DC=4
    -DTFT_RST=5
    -DTFT_BL=6
    -DSPI_FREQUENCY=40000000
    ; Xiao uses USB serial for detector connection
    -DUSE_USB_SERIAL=1

; =============================================================================
; LILYGO T-Display ESP32 (Built-in ST7789 135x240)
; =============================================================================
[env:lilygo-tdisplay]
extends = common
board = esp32dev
build_flags = 
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DSPI_FREQUENCY=40000000
    -DSMALL_DISPLAY=1
    -DDETECTOR_RX_PIN=27
    -DDETECTOR_TX_PIN=26

; =============================================================================
; LILYGO T-Display S3 (ESP32-S3 + built-in ST7789 170x320)
; =============================================================================
[env:lilygo-tdisplay-s3]
extends = common
board = lilygo-t-display-s3
board_build.partitions = huge_app.csv
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_BL=38
    -DSPI_FREQUENCY=40000000
    -DUSE_USB_SERIAL=1

; =============================================================================
; NOTE: Heltec WiFi LoRa 32 V3/V4 has SSD1306 OLED, NOT TFT!
; Use the esp32s3-heltec-v4 folder instead: cd ../esp32s3-heltec-v4 && pio run -e heltec-esp32s3-v4 -t upload
; =============================================================================
